version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: khunglongchau-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-khunglongchau}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-khunglongchau}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khunglongchau-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      # Môi trường database: Sử dụng tên service 'db' để kết nối nội bộ
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-khunglongchau}?schema=public
    env_file:
      - .env

  # vnpay-backend:
  #   build:
  #     context: ./vnpay_nodejs
  #     dockerfile: Dockerfile
  #   container_name: khunglongchau-vnpay
  #   restart: always
  #   ports:
  #     - "8888:8888"
  #   environment:
  #     - NODE_ENV=production
  #     - PORT=8888

volumes:
  postgres_data:

